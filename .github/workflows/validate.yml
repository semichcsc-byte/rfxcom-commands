name: Validate

on:
  push:
  pull_request:
  schedule:
    # Both actions validate against current Home Assistant, so this catches
    # breakage introduced by Home Assistant releases, not just by our commits.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.9 requires 3.14, and so does the test harness
          # that pins to it.
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest
